# Builds RBCAgent.exe on GitHub's Windows machines every time you upload changes,
# and publishes RBCAgent.zip on the repository's "Releases" page.
name: Build RBCAgent.exe

on:
  push:
    branches: [main]
  workflow_dispatch:        # also adds a "Run workflow" button on the Actions tab

permissions:
  contents: write           # needed to publish the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: python -m pip install --upgrade pip pyinstaller -r requirements.txt

      - name: Install Tesseract OCR
        run: choco install tesseract -y --no-progress

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RBCAgent main.py

      - name: Assemble RBCAgent folder
        shell: pwsh
        run: |
          $out = "release/RBCAgent"
          New-Item -ItemType Directory -Force -Path $out, "$out/logs", "$out/debug" | Out-Null
          Copy-Item dist/RBCAgent.exe $out
          Copy-Item config $out -Recurse
          Copy-Item data $out -Recurse
          Remove-Item "$out/config/config.json" -ErrorAction SilentlyContinue

      - name: Bundle Tesseract OCR
        shell: bash
        run: bash tools/bundle_tesseract.sh release/RBCAgent/tesseract

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path release/RBCAgent -DestinationPath release/RBCAgent.zip -Force

      # Lets a build of any branch be downloaded from the Actions run page.
      - name: Keep the zip on the run page
        uses: actions/upload-artifact@v4
        with:
          name: RBCAgent
          path: release/RBCAgent.zip
          retention-days: 7

      - name: Publish release
        if: github.ref == 'refs/heads/main'      # only main makes a public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RBC Agent build ${{ github.run_number }}
          body: Download **RBCAgent.zip**, unzip it and run **RBCAgent.exe**. Tesseract OCR is included (tesseract folder).
          files: release/RBCAgent.zip
          make_latest: true
